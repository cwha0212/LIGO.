# nx_mapping.launch.py 용 오버레이 — 베이스는 config/avia.yaml
# mapping_mode: true → PCD 누적/저장 활성 (지도 저장 세션)
# 실내 그리드/참조 PCD 경로 비움 → 기동 시 loadIndoorGridMaps/initIndoorGICP 분기 미실행
/**:
  ros__parameters:
    # 매핑은 로컬에 먼저 저장하고, stop 완료 후 오케스트레이터가 rsync 로 /mnt/rms_maps 에 업로드한다.
    # 상대 경로 "PCD" → C++ parameters.cpp 가 빌드 시 ROOT_DIR(패키지 소스 루트)/PCD 로 해석.
    # 빈 문자열이면 코드에서 /mnt/rms_maps 로 폴백하므로 비우면 안 됨.
    map_folder: "PCD"
    mapping:
      mapping_mode: true
    indoor:
      grid_map_dir: ""
      map_pcd_path: ""
    # 매핑 세션 PCD 저장 이름·간격·그리드 (루트는 map_folder)
    pcd_save:
      # {map_folder}/{map_name}/{sub_map_name}/{sub_map_name}.pcd (+ grid yaml/pgm, ecef) — 동일 이름이면 덮어쓰기
      map_name: "map"
      interval: -1
      grid2d_resolution: 0.2
      # 맵 PCD·ECEF·tmp_map 분할 PCD 공통 VoxelGrid 리프(m). 0이면 다운샘플 없이 저장
      downsample_voxel_m: 0.2
      # 실시간 분할: tmp_map/… (ECEF 누적); 위 downsample_voxel_m 적용
      tmp_map:
        enable: false
        interval_sec: 1.0
